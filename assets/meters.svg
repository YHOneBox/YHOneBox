<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Ability meters">
  <defs>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="250" rx="10" fill="#050914"/>
  <text x="36" y="42" fill="#9bb3c9" font-family="IBM Plex Mono, Consolas, monospace" font-size="13">COMPUTER VISION</text>
  <rect x="360" y="28" width="760" height="16" rx="8" fill="#0b1220" stroke="#5ce1ff" stroke-opacity="0.25"/>
  <rect x="360" y="28" width="24" height="16" rx="8" fill="#5ce1ff" filter="url(#glow)">
    <animate attributeName="width" values="24;684;629;684" dur="2.80s" repeatCount="indefinite"/>
  </rect>
  <text x="1140" y="42" text-anchor="end" fill="#5ce1ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">90</text>
  <text x="36" y="84" fill="#9bb3c9" font-family="IBM Plex Mono, Consolas, monospace" font-size="13">LLM / RAG SYSTEMS</text>
  <rect x="360" y="70" width="760" height="16" rx="8" fill="#0b1220" stroke="#b794f6" stroke-opacity="0.25"/>
  <rect x="360" y="70" width="24" height="16" rx="8" fill="#b794f6" filter="url(#glow)">
    <animate attributeName="width" values="24;668;614;668" dur="3.05s" repeatCount="indefinite"/>
  </rect>
  <text x="1140" y="84" text-anchor="end" fill="#b794f6" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">88</text>
  <text x="36" y="126" fill="#9bb3c9" font-family="IBM Plex Mono, Consolas, monospace" font-size="13">EDGE + DEPLOY</text>
  <rect x="360" y="112" width="760" height="16" rx="8" fill="#0b1220" stroke="#2ee6a6" stroke-opacity="0.25"/>
  <rect x="360" y="112" width="24" height="16" rx="8" fill="#2ee6a6" filter="url(#glow)">
    <animate attributeName="width" values="24;623;573;623" dur="3.30s" repeatCount="indefinite"/>
  </rect>
  <text x="1140" y="126" text-anchor="end" fill="#2ee6a6" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">82</text>
  <text x="36" y="168" fill="#9bb3c9" font-family="IBM Plex Mono, Consolas, monospace" font-size="13">MULTIMODAL IO</text>
  <rect x="360" y="154" width="760" height="16" rx="8" fill="#0b1220" stroke="#f0d48a" stroke-opacity="0.25"/>
  <rect x="360" y="154" width="24" height="16" rx="8" fill="#f0d48a" filter="url(#glow)">
    <animate attributeName="width" values="24;608;559;608" dur="3.55s" repeatCount="indefinite"/>
  </rect>
  <text x="1140" y="168" text-anchor="end" fill="#f0d48a" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">80</text>
  <text x="36" y="210" fill="#9bb3c9" font-family="IBM Plex Mono, Consolas, monospace" font-size="13">SYSTEMS INTEGRATION</text>
  <rect x="360" y="196" width="760" height="16" rx="8" fill="#0b1220" stroke="#ff4d9a" stroke-opacity="0.25"/>
  <rect x="360" y="196" width="24" height="16" rx="8" fill="#ff4d9a" filter="url(#glow)">
    <animate attributeName="width" values="24;653;600;653" dur="3.80s" repeatCount="indefinite"/>
  </rect>
  <text x="1140" y="210" text-anchor="end" fill="#ff4d9a" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">86</text>
</svg>
